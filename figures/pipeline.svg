<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 536" width="1104" height="536" role="img" aria-labelledby="gjoll-pipeline-en-title gjoll-pipeline-en-desc">
<title id="gjoll-pipeline-en-title">Gjöll data pipeline</title>
<desc id="gjoll-pipeline-en-desc">Fatal-fire incidents are compiled from archival sources into the Gjöll registry, cross-checked against the official 1968–2018 fire-death series, analysed, re-coded blind by two language models as a reproducibility check, and reconciled against official cause-of-death statistics; every reported number is recomputed in CI.</desc>
