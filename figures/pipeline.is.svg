<title id="gjoll-pipeline-is-title">Gagnaferli Gjallar</title>
<desc id="gjoll-pipeline-is-desc">Banvæn brunatilvik eru tekin saman úr heimildum í Gjallarskrána, borin saman við opinberar tölur um dauðsföll í eldsvoðum 1968–2018, greind, endurkóðuð blint af tveimur mállíkönum sem endurtekningarpróf og stemmd af við opinbera dánarmeinaskrá; hver birt tala er endurreiknuð í CI.</desc>
