<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 536" width="912" height="536" role="img" aria-labelledby="gjoll-pipeline-is-title gjoll-pipeline-is-desc">
<title id="gjoll-pipeline-is-title">Gagnaferli Gjallar</title>
<desc id="gjoll-pipeline-is-desc">Banvæn brunatilvik eru tekin saman úr heimildum í Gjallarskrána, endurkóðuð blint af tveimur mállíkönum sem endurtekningarpróf, stemmd af við opinbera dánarmeinaskrá og greind með ákvörðunarbundnum kóða þar sem hver birt tala er endurreiknuð í CI.</desc>
